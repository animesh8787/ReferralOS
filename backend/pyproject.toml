[project]
name = "referralos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "sqlalchemy==2.0.43", "alembic==1.16.4",
  "pydantic==2.11.7", "pydantic-settings", "python-multipart", "argon2-cffi",
  "cryptography", "httpx==0.28.1", "email-validator", "phonenumbers", "charset-normalizer",
  "pymupdf==1.25.5", "pdfplumber==0.11.10", "python-docx==1.1.2", "reportlab==5.0.1",
  "openpyxl==3.1.5", "rapidfuzz==3.13.0", "psycopg[binary]",
]
[dependency-groups]
dev = ["pytest==8.4.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: larger synthetic-data runs"]
[tool.setuptools]
packages = []
