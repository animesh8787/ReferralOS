# Render blueprint: the API with its background worker running inside it (RUN_WORKER=1). Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: referralos-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - {key: ADAPTER_MODE, value: real}
      - {key: RUN_WORKER, value: "1"}
      - {key: COOKIE_SECURE, value: "true"}
      - {key: DATABASE_URL, sync: false}        # Supabase "Session pooler" connection string, with +psycopg (see docs/DEPLOY.md)
      - {key: APP_KEK, sync: false}             # python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      - {key: APP_URL, sync: false}             # https://<your-vercel-domain>
      - {key: CORS_ORIGINS, sync: false}        # ["https://<your-vercel-domain>"]
      - {key: FIREBASE_PROJECT_ID, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: STORAGE_BUCKET, value: referralos}
      - {key: RESEND_API_KEY, sync: false}      # optional now: Firebase sends the sign-in emails
      - {key: GOOGLE_CLIENT_ID, sync: false}    # only for sending outreach through Gmail
      - {key: GOOGLE_CLIENT_SECRET, sync: false}
